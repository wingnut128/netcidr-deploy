name: Deploy

# Manual deploy to AWS via SAM. Authenticates to AWS via GitHub OIDC (no
# static keys) and pulls deploy secrets from 1Password via a service
# account, mirroring the local `op inject` flow.
#
# Mirrors `cd aws && just deploy`:
#   1. Check out wingnut128/netcidr at the requested ref
#   2. Build the React dashboard (with VITE_OAUTH_WEB_CLIENT_ID baked in)
#   3. Build the arm64 Lambda binary via cargo-lambda
#   4. sam validate + sam deploy with parameter-overrides from 1Password
#
# One-time setup (see CLAUDE.md):
#   - 1Password service account scoped to the `netcidr-deployment` vault;
#     token stored as repo secret OP_SERVICE_ACCOUNT_TOKEN
#   - GitHub OIDC provider + IAM role provisioned via aws/oidc-bootstrap.yaml
#   - Repo secrets: OP_SERVICE_ACCOUNT_TOKEN
#   - Repo variables: AWS_REGION, PUBLIC_HOSTNAME

on:
  workflow_dispatch:
    inputs:
      netcidr_ref:
        description: "netcidr git ref to build (tag/branch/SHA)"
        required: false
        default: "main"
        type: string
      stack_name:
        description: "CloudFormation stack name"
        required: false
        default: "netcidr"
        type: string
  # Fired from wingnut128/netcidr's release workflow when a new vX.Y.Z
  # tag is published. Payload: { ref: "vX.Y.Z", stack: "netcidr" }.
  repository_dispatch:
    types: [netcidr-released]

permissions:
  id-token: write # OIDC → AWS
  contents: read

concurrency:
  group: deploy-${{ github.event.client_payload.stack || inputs.stack_name || 'netcidr' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Resolve from repository_dispatch payload if dispatched, otherwise
  # from workflow_dispatch inputs, otherwise default. Each step uses
  # env.NETCIDR_REF / env.STACK_NAME instead of inputs/payload directly.
  NETCIDR_REF: ${{ github.event.client_payload.ref || inputs.netcidr_ref || 'main' }}
  STACK_NAME: ${{ github.event.client_payload.stack || inputs.stack_name || 'netcidr' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out deploy repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deploy

      - name: Check out netcidr source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wingnut128/netcidr
          ref: ${{ env.NETCIDR_REF }}
          path: netcidr

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1"

      # gnu, not musl: `cargo lambda build --arm64` with no explicit
      # --target resolves to aarch64-unknown-linux-gnu (TARGET_ARM in
      # cargo-lambda's target_arch.rs). Zig is what makes a glibc target
      # safe here — it links against an older glibc than the runner's,
      # bridging ubuntu's 2.39 down to AL2023's 2.34.
      - name: Set up Rust (stable + aarch64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-unknown-linux-gnu

      # Zig is cargo-lambda's cross-linker (via cargo-zigbuild). Pinned to
      # 0.13.0 deliberately — newer Zig has broken cargo-zigbuild before.
      #
      # This action downloads from Zig's community mirror list and verifies
      # each tarball's minisign signature against upstream's public key.
      # That matters beyond integrity: the Zig Software Foundation asks
      # automation not to pull from ziglang.org directly, to save them
      # bandwidth. It also caches the global Zig cache between runs.
      - name: Set up Zig (cargo-lambda's cross linker)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      # Installed via taiki-e/install-action — the canonical prebuilt-binary
      # installer already used for Rust tooling elsewhere. It replaced
      # zerj9/setup-cargo-lambda, a 2-star single-maintainer wrapper last
      # touched in Jan 2025 whose only job was downloading this same
      # release. cargo-lambda itself is well maintained; only the wrapper
      # was the weak link.
      #
      # cargo-lambda is pinned to the version the old action defaulted to,
      # so this changes how the binary is installed, not which one.
      - name: Install cargo-lambda
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-lambda@1.3.0

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      # Pull deploy secrets from 1Password into env vars. Mirrors the
      # `op://netcidr-deployment/...` references in samconfig.toml.tpl.
      # The service account's token is the only credential GitHub holds;
      # everything else lives in the vault.
      #
      # Deliberately placed as late as possible — immediately before the
      # first step that needs a secret. `export-env: true` puts these in
      # the job environment for every subsequent step, so every
      # third-party action that runs earlier (setup-bun, rust-toolchain,
      # setup-zig, install-action, setup-sam) does its work before
      # any credential exists to read. harden-runner runs in `audit`
      # mode, which logs egress but does not block it, so keeping this
      # window small is the actual control.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AWS_ROLE_TO_ASSUME: op://netcidr-deployment/aws-deploy-role/arn
          DATABASE_URL: op://netcidr-deployment/neon/connect_string
          PAT_PEPPER: op://netcidr-deployment/pat-pepper/value
          OIDC_AUDIENCE: op://netcidr-deployment/gcp-client-id/client_id
          CERTIFICATE_ARN: op://netcidr-deployment/certificate/arn
          CLOUDFLARE_API_TOKEN: op://netcidr-deployment/cloudflare/api_token
          CLOUDFLARE_ZONE_ID: op://netcidr-deployment/cloudflare/zone_id

      - name: Build dashboard SPA
        working-directory: netcidr/dashboard
        env:
          # Vite bakes this into the bundle. Same value as Lambda's
          # NETCIDR_OIDC_AUDIENCE — the Google OAuth Web Client ID,
          # already loaded into env by the 1Password step.
          VITE_OAUTH_WEB_CLIENT_ID: ${{ env.OIDC_AUDIENCE }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Lambda binary (arm64 gnu)
        working-directory: netcidr
        run: |
          cargo lambda build --release --arm64 \
            --bin lambda --features lambda,ipam-postgres
          ls -lh target/lambda/lambda/bootstrap

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}

      - name: SAM validate
        working-directory: deploy/aws
        run: sam validate --lint

      - name: SAM deploy
        working-directory: deploy/aws
        # workflow_dispatch inputs and repo vars flow through env vars
        # (never inlined as `${{ … }}` into shell) to defuse injection.
        # DATABASE_URL / OIDC_AUDIENCE / CERTIFICATE_ARN already in env
        # from the 1Password step.
        env:
          STACK_NAME: ${{ env.STACK_NAME }}
          REGION: ${{ env.AWS_REGION }}
          PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "AppName=$STACK_NAME" \
              "DatabaseUrl=$DATABASE_URL" \
              "PatPepper=$PAT_PEPPER" \
              "OidcAudience=$OIDC_AUDIENCE" \
              "PublicHostname=$PUBLIC_HOSTNAME" \
              "CertificateArn=$CERTIFICATE_ARN"

      - name: Show stack outputs
        env:
          STACK_NAME: ${{ env.STACK_NAME }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Sync Cloudflare DNS
        # Upserts the CNAME at $CLOUDFLARE_RECORD_NAME -> CloudFront
        # distribution domain (read from the stack output). Idempotent —
        # the same script local `just cloudflare-sync` runs.
        # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID came from the
        # 1Password step. CLOUDFLARE_PROXIED is hardcoded false because
        # the architecture requires gray-cloud (CloudFront terminates
        # user-facing TLS; orange-cloud breaks Host-header rewriting).
        working-directory: deploy/aws
        env:
          CLOUDFLARE_RECORD_NAME: ${{ vars.CLOUDFLARE_RECORD_NAME }}
          CLOUDFLARE_PROXIED: "false"
          SAM_STACK_NAME: ${{ env.STACK_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: bash cloudflare/update-dns.sh
