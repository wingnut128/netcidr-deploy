type: '@swamp/aws/cloudformation/stack'
typeVersion: 2026.10.23.1
id: c3ed413e-bddb-44c4-ad75-e4f00213f9f4
name: netcidr-stack
version: 1
tags: {}
globalArguments:
  name: netcidr
  region: us-east-2
  StackName: netcidr
  # Rendered by netcidr-artifact's package method: aws/template.yaml as
  # JSON, CodeUri pointing at the uploaded zip.
  TemplateBody: >-
    ${{ data.latest("netcidr-artifact", "package").attributes.body }}
  Capabilities:
    - CAPABILITY_IAM
    - CAPABILITY_AUTO_EXPAND
  # Same 1Password items as aws/samconfig.toml.tpl, so one rotation
  # covers both paths.
  # LogRetentionDays and ExpirySweepSchedule keep their template defaults.
  Parameters:
    AppName: netcidr
    PublicHostname: netcidr.cloudreaper.dev
    DatabaseUrl: '${{ vault.get("netcidr", "neon/connect_string") }}'
    PatPepper: '${{ vault.get("netcidr", "pat-pepper/value") }}'
    OidcAudience: '${{ vault.get("netcidr", "gcp-client-id/client_id") }}'
    OidcCliClientId: '${{ vault.get("netcidr", "gcp-cli-client/client_id") }}'
    OidcCliClientSecret: '${{ vault.get("netcidr", "gcp-cli-client/client_secret") }}'
    CertificateArn: '${{ vault.get("netcidr", "certificate/arn") }}'
    OriginVerifySecret: '${{ vault.get("netcidr", "origin-verify/secret") }}'
    RateLimitPerSecond: "20"
    RateLimitBurst: "50"
    ReservedConcurrency: "0"
methods: {}
